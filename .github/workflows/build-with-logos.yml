name: Build with logos

# 上游同步（Sync upstream）完成后自动运行：扫描所有直播源，补全频道图标，
# 生成新的 M3U / TXT 产物，发布到 `dist` 分支（每次覆盖，只保留最新快照，不膨胀历史）。
# 直接修改仓库里的直播源或 logo 也会触发。
#
# 产物访问地址（raw 直链，可直接填进播放器）：
#   https://raw.githubusercontent.com/<owner>/<repo>/dist/iptv.m3u
#   https://cdn.jsdelivr.net/gh/<owner>/<repo>@dist/iptv.m3u

on:
  workflow_run:
    workflows: ["Sync upstream"]
    types: [completed]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      max-urls:
        description: 每个频道保留的最大地址数（0 = 不限）
        type: string
        default: "5"
      epg-icons:
        description: 是否额外生成带图标 <icon> 的 epg.xml
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: build-with-logos
  cancel-in-progress: true

jobs:
  build:
    # 同步流程失败或取消时不生成产物，避免用残缺数据覆盖上一版
    if: >-
      github.event_name != 'workflow_run'
      || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MAX_URLS: ${{ github.event.inputs.max-urls || '5' }}
      EPG_ICONS: ${{ github.event.inputs.epg-icons == 'true' && 'true' || 'false' }}
      # 图标直连上游 logo 目录（本仓库 main 也镜像了一份，用上游可保证图标最新）
      LOGO_BASE: https://cdn.jsdelivr.net/gh/xisohi/CHINA-IPTV@main/logo

    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Skip loop (dist-branch builds and dist-only commits)
        id: guard
        run: |
          msg=$(git log -1 --pretty=%s)
          echo "最新提交: $msg"
          case "$msg" in
            # 产物提交永远不会出现在 main 上，这里只作为防循环的保险
            "chore(dist):"*)
              echo "run=false" >> "$GITHUB_OUTPUT"
              echo "### 跳过：产物提交不触发构建" >> "$GITHUB_STEP_SUMMARY"
              ;;
            # 同步提交由 Sync upstream 的 workflow_run 负责构建，push 这一次不重复跑
            "chore(sync):"*)
              if [ "$GITHUB_EVENT_NAME" = "push" ]; then
                echo "run=false" >> "$GITHUB_OUTPUT"
                echo "### 跳过：同步提交交由 workflow_run 构建" >> "$GITHUB_STEP_SUMMARY"
              else
                echo "run=true" >> "$GITHUB_OUTPUT"
              fi
              ;;
            *) echo "run=true" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Check whether sources changed since last build
        id: freshness
        if: steps.guard.outputs.run == 'true'
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" != "workflow_run" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          current=""
          [ -f .upstream-sha ] && current=$(tr -d '[:space:]' < .upstream-sha)
          last=""
          if git fetch -q --depth=1 origin dist 2>/dev/null; then
            last=$(git show FETCH_HEAD:.source-sha 2>/dev/null | tr -d '[:space:]' || true)
          fi
          echo "源码版本: ${current:-<无>} / 上次构建: ${last:-<无>}"
          if [ -n "$current" ] && [ "$current" = "$last" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "依赖的源码没有变化，跳过本次构建"
            echo "### 跳过：源码未变化" >> "$GITHUB_STEP_SUMMARY"
            echo "上游源码仍是 \`$current\`，\`dist\` 分支已是最新，无需重新生成。" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate playlists with channel logos
        if: steps.guard.outputs.run == 'true' && steps.freshness.outputs.run == 'true'
        id: logos
        uses: ./.github/actions/add-logos
        with:
          out: dist
          logo-base: ${{ env.LOGO_BASE }}
          max-urls: ${{ env.MAX_URLS }}
          epg-icons: ${{ env.EPG_ICONS }}

      - name: Upload artifacts
        if: steps.guard.outputs.run == 'true' && steps.freshness.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: iptv-with-logos
          path: dist/
          retention-days: 14
          if-no-files-found: error

      - name: Publish to dist branch
        if: steps.guard.outputs.run == 'true' && steps.freshness.outputs.run == 'true'
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 记录本次产物对应的源码版本，下次构建前比对，源码没变就不重复生成
          if [ -f .upstream-sha ]; then
            cp -f .upstream-sha dist/.source-sha
          else
            git rev-parse HEAD > dist/.source-sha
          fi

          # 用孤儿提交承载产物：dist 分支只保留最新一份快照，避免每天几十 MB 的历史堆积。
          # 借 --work-tree=dist 把产物内容直接放到分支根目录，
          # 这样 raw/CDN 地址就是 `<分支>/iptv.m3u`，不带 dist/ 前缀。
          git checkout --orphan dist-publish
          git rm -r --cached . >/dev/null
          git --work-tree=dist add -A -f .
          git commit -q -m "chore(dist): 生成带图标的产物 $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push --force origin dist-publish:dist

      - name: Summary
        if: steps.guard.outputs.run == 'true' && steps.freshness.outputs.run == 'true'
        run: |
          repo="${GITHUB_REPOSITORY}"
          {
            echo "### 生成结果"
            echo ""
            echo "- 图标覆盖：${{ steps.logos.outputs.coverage }}"
            echo "- 产物已发布到 \`dist\` 分支根目录（每次构建覆盖，只保留最新快照）"
            echo ""
            echo "| 文件 | 说明 |"
            echo "| --- | --- |"
            echo "| \`iptv.m3u\` | 推荐：全量源，每频道限 ${MAX_URLS} 个地址，带 tvg-logo |"
            echo "| \`iptv-full.m3u\` | 全量源，不限地址数 |"
            echo "| \`iptv.txt\` | DIYP / TVBox 风格 |"
            echo "| \`unicast/\` \`multicast/\` | 分省分运营商 |"
            echo "| \`logo-coverage.txt\` | 覆盖率与未匹配频道清单 |"
            echo ""
            echo "订阅地址："
            echo ""
            echo '```'
            echo "https://raw.githubusercontent.com/${repo}/dist/iptv.m3u"
            echo "https://cdn.jsdelivr.net/gh/${repo}@dist/iptv.m3u"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
